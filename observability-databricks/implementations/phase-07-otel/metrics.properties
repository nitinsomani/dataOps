# ============================================================================
# Phase 7 — Spark metrics sink config (metrics.properties)
# Exposes Spark/JVM metrics on a Prometheus endpoint the ADOT collector scrapes.
# Reference from the cluster Spark conf:
#   spark.metrics.conf /databricks/spark/conf/metrics.properties
# (or bake into the init script). Gives GC, memory, shuffle, spill, executor
# metrics that system.compute.* does NOT expose.
# ============================================================================

# Enable the built-in Prometheus servlet sink (Spark 3.x+).
*.sink.prometheusServlet.class=org.apache.spark.metrics.sink.PrometheusServlet
*.sink.prometheusServlet.path=/metrics/prometheus
master.sink.prometheusServlet.path=/metrics/master/prometheus
applications.sink.prometheusServlet.path=/metrics/applications/prometheus

# JVM source (GC, heap, non-heap, threads).
*.source.jvm.class=org.apache.spark.metrics.source.JvmSource

# Notes:
#  - The PrometheusServlet is exposed on the Spark UI port; for a dedicated
#    scrape target (localhost:9091 in otel-init.sh) use a pushgateway or the
#    prometheus receiver pointed at the Spark UI metrics path instead.
#  - Confirm the exact scrape target wiring against your runtime before prod.
